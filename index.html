<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Speak Camera</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #status{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:rgba(0,0,0,.7);color:#fff;padding:10px 16px;border-radius:22px;
    font-size:14px;white-space:nowrap
  }
  #start{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    border:0;border-radius:28px;padding:15px 24px;font-size:17px;
    background:#fff;color:#000
  }
  #stop{
    position:fixed;right:16px;top:16px;border:0;border-radius:20px;
    padding:9px 14px;background:rgba(0,0,0,.65);color:#fff
  }
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<button id="start">Start Camera &amp; Reading</button>
<button id="stop" hidden>Stop</button>
<div id="status">Ready</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const video = document.getElementById("camera");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const statusEl = document.getElementById("status");

let stream = null;
let worker = null;
let running = false;
let processing = false;
let lastSpoken = "";
let lastSpokenAt = 0;
let stableText = "";
let stableCount = 0;
let lastCapture = 0;

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});

function status(s){ statusEl.textContent = s; }

function cleanText(text){
  return text
    .replace(/[|{}[\]<>~^_`]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function normalizeForCompare(text){
  return text.toLowerCase().replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim();
}

function isUseful(text){
  const t = cleanText(text);
  if(t.length < 2) return false;
  const letters = (t.match(/[A-Za-z]/g)||[]).length;
  return letters >= 2 && letters / t.length > 0.35;
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  u.pitch = 1;
  speechSynthesis.speak(u);
}

async function initOCR(){
  status("Loading OCR…");
  worker = await Tesseract.createWorker("eng", 1, {
    logger: m => {
      if(m.status && m.progress != null)
        status("OCR: " + m.status + " " + Math.round(m.progress*100) + "%");
    }
  });
  await worker.setParameters({
    tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT
  });
}

async function start(){
  startBtn.hidden = true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject = stream;
    await video.play();

    if(!worker) await initOCR();

    running = true;
    stopBtn.hidden = false;
    status("Point camera at English text");
    loop();
  }catch(e){
    console.error(e);
    status("Camera permission required");
    startBtn.hidden = false;
  }
}

async function loop(){
  if(!running) return;

  const now = Date.now();
  // OCR approximately every 1.5 seconds to keep the phone responsive.
  if(!processing && video.readyState >= 2 && now-lastCapture >= 1500){
    lastCapture = now;
    processing = true;
    try{
      // Downscale for faster OCR.
      const w = 960;
      const h = Math.round(w * video.videoHeight / video.videoWidth);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(video,0,0,w,h);

      const result = await worker.recognize(canvas);
      const text = cleanText(result.data.text);

      if(isUseful(text)){
        const normalized = normalizeForCompare(text);

        // Require the same text in two consecutive OCR results.
        if(normalized === stableText) stableCount++;
        else { stableText = normalized; stableCount = 1; }

        // Read only when text is stable and is not a recently spoken repeat.
        if(stableCount >= 2 &&
           normalized !== normalizeForCompare(lastSpoken) &&
           Date.now()-lastSpokenAt > 2500){
          lastSpoken = text;
          lastSpokenAt = Date.now();
          status("Reading…");
          speak(text);
        } else {
          status("Text detected");
        }
      } else {
        stableText = "";
        stableCount = 0;
        status("Point camera at English text");
      }
    }catch(e){
      console.error(e);
      status("OCR error — retrying");
    }
    processing = false;
  }
  requestAnimationFrame(loop);
}

function stop(){
  running = false;
  if(stream) stream.getTracks().forEach(t=>t.stop());
  video.srcObject = null;
  speechSynthesis.cancel();
  stopBtn.hidden = true;
  startBtn.hidden = false;
  status("Stopped");
}

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);
</script>
</body>
</html>
